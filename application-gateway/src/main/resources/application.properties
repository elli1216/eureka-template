spring.application.name=application-gateway
server.port=8080

spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=item-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://item-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/item-service-mapped/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=order-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/order-service-mapped/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
